name: sigh_poste
description: SIGH-CNT — poste de travail (fileul) et poste mère, Flutter desktop.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
# Les versions sont volontairement non figées : `flutter pub get` les résout, puis on les fige.
dependencies:
  flutter:
    sdk: flutter
  sigh_sync:
    path: ../../packages/sync_dart
  sigh_domaine:
    path: ../../packages/domaine
  drift: any
  sqlcipher_flutter_libs: any   # base locale chiffrée (SQLCipher)
  http: any
  cryptography: any             # enveloppes chiffrées de bout en bout vers le relais
  shelf: any                    # mode mère : serveur HTTP local
  shelf_router: any
  postgres: any                 # mode mère : PostgreSQL local
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
flutter:
  uses-material-design: true
